<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Nav Debug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2B2D42;
            color: white;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(43, 45, 66, 0.95);
            padding: 1rem;
            z-index: 1000;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar-brand {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .navbar-nav {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .navbar-nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
        }

        .navbar-nav a:hover {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .navbar-toggle {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
        }

        .navbar-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .navbar-mobile {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(43, 45, 66, 0.98);
            z-index: 1010;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .navbar-mobile.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            visibility: visible;
        }

        .navbar-mobile .navbar-nav {
            flex-direction: column;
            gap: 2rem;
            text-align: center;
        }

        .navbar-mobile .navbar-nav a {
            font-size: 2rem;
            padding: 1rem 2rem;
            border-radius: 8px;
            min-width: 200px;
            display: block;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2B2D42, #1E3A8A);
            padding-top: 80px; /* Account for navbar */
        }

        .debug-info {
            position: fixed;
            top: 100px;
            right: 10px;
            background: red;
            color: white;
            padding: 10px;
            font-size: 12px;
            z-index: 9999;
            border-radius: 4px;
            max-width: 200px;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .navbar-nav {
                display: none;
            }
            
            .navbar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="debug-info" id="debug">
        <div>Screen: <span id="screen-width"></span>px</div>
        <div>Toggle visible: <span id="toggle-visible"></span></div>
        <div>Mobile active: <span id="mobile-active"></span></div>
        <div>Clicks: <span id="click-count">0</span></div>
    </div>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">Debug Nav</a>
            
            <ul class="navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
            
            <button class="navbar-toggle" id="navbar-toggle">
                &#9776;
            </button>
        </div>
    </nav>

    <div class="navbar-mobile" id="navbar-mobile">
        <ul class="navbar-nav">
            <li><a href="/" onclick="closeMobileMenu()">Home</a></li>
            <li><a href="/about" onclick="closeMobileMenu()">About</a></li>
            <li><a href="/contact" onclick="closeMobileMenu()">Contact</a></li>
        </ul>
    </div>

    <section class="hero">
        <div>
            <h1>Mobile Navigation Debug</h1>
            <p>Resize window to test mobile navigation</p>
        </div>
    </section>

    <script>
        let clickCount = 0;
        
        function updateDebugInfo() {
            const debugWidth = document.getElementById('screen-width');
            const debugToggle = document.getElementById('toggle-visible');
            const debugMobile = document.getElementById('mobile-active');
            const debugClicks = document.getElementById('click-count');
            const toggle = document.getElementById('navbar-toggle');
            const mobileMenu = document.getElementById('navbar-mobile');
            
            if (debugWidth) debugWidth.textContent = window.innerWidth;
            if (debugToggle) {
                const computedStyle = window.getComputedStyle(toggle);
                debugToggle.textContent = computedStyle.display;
            }
            if (debugMobile) {
                debugMobile.textContent = mobileMenu.classList.contains('active') ? 'YES' : 'NO';
            }
            if (debugClicks) debugClicks.textContent = clickCount;
        }

        function toggleMobileMenu() {
            clickCount++;
            console.log('Toggle clicked!', clickCount);
            
            const mobileMenu = document.getElementById('navbar-mobile');
            if (mobileMenu) {
                mobileMenu.classList.toggle('active');
                document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
                console.log('Mobile menu active:', mobileMenu.classList.contains('active'));
            }
            updateDebugInfo();
        }

        function closeMobileMenu() {
            const mobileMenu = document.getElementById('navbar-mobile');
            if (mobileMenu) {
                mobileMenu.classList.remove('active');
                document.body.style.overflow = '';
            }
            updateDebugInfo();
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('navbar-toggle');
            const mobileMenu = document.getElementById('navbar-mobile');
            
            if (toggle) {
                console.log('Toggle button found, adding event listener');
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Toggle button clicked via addEventListener');
                    toggleMobileMenu();
                });
                
                // Also add onclick as fallback
                toggle.onclick = function(e) {
                    e.preventDefault();
                    console.log('Toggle button clicked via onclick');
                    toggleMobileMenu();
                };
            } else {
                console.error('Toggle button not found!');
            }
            
            // Close menu when clicking outside
            if (mobileMenu) {
                mobileMenu.addEventListener('click', function(e) {
                    if (e.target === mobileMenu) {
                        closeMobileMenu();
                    }
                });
            }
            
            updateDebugInfo();
        });

        // Update debug info on resize
        window.addEventListener('resize', updateDebugInfo);
        
        // Update debug info every second
        setInterval(updateDebugInfo, 1000);
    </script>
</body>
</html>
