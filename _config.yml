# Research Interest Descriptions
research_descriptions:
  - "Developing transformer-based architectures and deep neural networks for multi-modal medical data fusion, with emphasis on robust and reliable diagnostic systems."
  - "Advancing automated medical image analysis through novel attention mechanisms and feature extraction techniques for skin lesion detection, classification, and segmentation."
  - "Building interpretable and explainable AI systems through concept bottleneck models, attention visualization, and human-in-the-loop intervention mechanisms for clinical decision support."
  - "Creating zero-shot and weakly-supervised learning methods for medical imaging that reduce annotation costs while maintaining clinical accuracy and reliability."

