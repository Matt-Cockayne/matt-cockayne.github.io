research_interests: 
  - "Artificial Intelligence"
  - "Computer Vision"
  - "Responsible AI"
  - "Medical Image Processing"

# Site Assets
photo: "/assets/images/profile.jpg"
cv_pdf: "/assets/cv.pdf"
favicon: "/assets/images/favicon.ico"

# Navigation
nav:
  - name: "Home"
    link: "/"
  - name: "CV"
    link: "/cv"
  - name: "Publications"
    link: "/publications"
  - name: "Projects"
    link: "/projects"
  - name: "Contact"
    link: "/contact"

# Jekyll Settings
permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:name/
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Build settings
sass:
  style: compressed

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

include:
  - assets
