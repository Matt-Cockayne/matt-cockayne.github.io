# Site Configuration
title: "Matthew Cockayne"
name: "Matthew Cockayne"
description: "PhD Candidate | AI Researcher | Advancing Human-AI Interaction"
tagline: "Advancing Human-AI Interaction through Multimodal Neural Networks"
url: "https://matt-cockayne.github.io"
baseurl: ""

# Personal Information
email: "your.email@university.edu"
github_username: "Matt-Cockayne"
linkedin: "https://www.linkedin.com/in/your-linkedin/"
google_scholar: "https://scholar.google.com/citations?user=your-id"
orcid: "https://orcid.org/your-orcid"
twitter_username: "your-twitter"

# Academic Information
institution: "Keele University"
department: "Department of Computer Science"
position: "PhD Candidate"
research_interests: 
  - "Artificial Intelligence"
  - "Machine Learning"
  - "Multimodal Neural Networks"
  - "Human-Computer Interaction"

# Site Assets
photo: "/assets/images/profile.jpg"
cv_pdf: "/assets/cv.pdf"
favicon: "/assets/images/favicon.ico"

# Navigation
nav:
  - name: "Home"
    link: "/"
  - name: "CV"
    link: "/cv"
  - name: "Publications"
    link: "/publications"
  - name: "Projects"
    link: "/projects"
  - name: "Contact"
    link: "/contact"

# Jekyll Settings
permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:name/
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Build settings
sass:
  style: compressed

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

include:
  - assets
