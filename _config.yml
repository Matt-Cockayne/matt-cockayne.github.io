# Research Interest Descriptions
research_descriptions:
  - "Developing deep learning architectures with systematic robustness evaluation under distribution shift, uncertainty quantification, and failure mode analysis for safe deployment in high-stakes settings."
  - "Advancing automated medical image analysis through novel attention mechanisms, with emphasis on characterising and mitigating model failures under real-world conditions."
  - "Building interpretable-by-design architectures (concept bottleneck models) enabling human oversight and intervention, with fairness-aware training that reduces demographic disparities without constraining performance."
  - "Evaluating foundation model reliability in zero-shot transfer settings, developing adaptive methods that reduce catastrophic failures and ensure safe deployment across domains."

