<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/styles.css">
    
    <!-- SEO and Meta Tags -->
    {% seo %}
    
    <!-- Favicon -->
    <link rel="icon" href="{{ site.favicon }}" type="image/x-icon">
</head>
<body data-theme="light" class="page-layout">
    <!-- Navigation -->
    {% include nav.html %}
    
    <!-- Main Content -->
    <main style="padding-top: 100px;">
        <section class="content-section">
            <div class="container">
                <div class="section-content">
                    {% if page.title %}
                    <div class="section-header">
                        <h1 class="section-title">{{ page.title }}</h1>
                        {% if page.description %}
                        <p class="section-description">{{ page.description }}</p>
                        {% endif %}
                    </div>
                    {% endif %}
                    
                    <div class="page-content">
                        {{ content }}
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; {{ "now" | date: "%Y" }} {{ site.name }}. All rights reserved.</p>
            <p>Built with Jekyll and hosted on GitHub Pages.</p>
        </div>
    </footer>
    
    <!-- Scripts -->
    <script src="/assets/theme-toggle.js"></script>
    <script src="/assets/animations.js"></script>
</body>
</html>
