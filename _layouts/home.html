<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
    {% seo %}
</head>
<body>
    {% include nav.html %}
    <main class="container">
        <section class="profile-intro">
            <img src="{{ site.photo }}" alt="Matthew Cockayne" class="profile-photo" />
            <h1>Matthew Cockayne</h1>
            <h2>PhD Candidate in [Your Field] at [Your Institution]</h2>
            <p class="bio">My research focuses on [short research summary].</p>
            <div class="contact-links">
                <a href="mailto:{{ site.email }}">Email</a>
                <a href="https://github.com/{{ site.github_username }}">GitHub</a>
                <a href="{{ site.linkedin }}">LinkedIn</a>
                <a href="{{ site.google_scholar }}">Google Scholar</a>
                <a href="{{ site.orcid }}">ORCID</a>
            </div>
        </section>
        <section class="main-content">
            {{ content }}
        </section>
    </main>
    <footer>
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}</p>
    </footer>
    <script src="/assets/theme-toggle.js"></script>
</body>
</html>
