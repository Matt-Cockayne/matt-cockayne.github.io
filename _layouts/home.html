<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="/assets/styles.css">
    {% seo %}
</head>
<body>
    {% include nav.html %}
    <main class="container">
        <div class="profile-intro">
            <img src="{{ site.photo }}" alt="Matthew Cockayne" class="profile-photo" />
            <h1>Matthew Cockayne</h1>
            <p>PhD Candidate in [Your Field] at [Your Institution]. My research focuses on [short research summary].</p>
            <div class="contact-links">
                <a href="mailto:{{ site.email }}">Email</a> |
                <a href="https://github.com/{{ site.github_username }}">GitHub</a> |
                <a href="{{ site.linkedin }}">LinkedIn</a> |
                <a href="{{ site.google_scholar }}">Google Scholar</a> |
                <a href="{{ site.orcid }}">ORCID</a>
            </div>
        </div>
        {{ content }}
    </main>
    <footer>
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}</p>
    </footer>
    <script src="/assets/theme-toggle.js"></script>
</body>
</html>
